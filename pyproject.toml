[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [{name="emkulpa"}, {name="mabarlag"}]
description = "A reusable mazegenerator to generate perfect and imperfect mazes"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["pydantic>=2", "typing_extensions"]

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
mazegen = ["42.txt"]
