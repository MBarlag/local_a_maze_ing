[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [{name="emkulpa"}, {name="mabarlag"}]
description = "A reusable mazegenerator to generate perfect and imperfect mazes"
requires-python = ">=3.10"
license = "MIT"
readme = "README.MD"

[tool.setuptools.packages]
find = {}

# Run the following command to build the package:
# python -m build --wheel
