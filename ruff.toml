target-version = "py310"
line-length = 79
exclude = ["*tests*"]
[lint]
ignore = ["SIM103", "BLE001"]
extend-select = [
    # ...
    "D",   # pydocstyle - https://docs.astral.sh/ruff/rules/#pydocstyle-d
    # ...
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**/*" = [
    # ...
    "D",      # Don't check docstrings in tests
    # ...
]
